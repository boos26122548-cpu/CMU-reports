<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMU Report — แผนที่แจ้งปัญหา</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css?v=1.6"/>
    <style>
        /* TOAST NOTIFICATION */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            display: none;
            z-index: 9999;
            font-family: sans-serif;
        }
        /* Back button */
        #back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2000;
            padding: 8px 14px;
            background: #1E2D5A;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-family: sans-serif;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        #back-btn:hover { background: #2563EB; }
    </style>
</head>
<body>

  <div id="toast"></div>

  <!-- ปุ่มกลับหน้าหลัก -->
  <button id="back-btn" onclick="window.location.href='cmu-report-final9.html'">← หน้าหลัก</button>



  <div id="map"></div>

  <!-- ปุ่ม GPS ลอยมุมซ้ายล่างสำหรับมือถือ/ไอแพด -->
  <button id="mobileGpsBtn" class="mobile-only-gps-btn" onclick="getUserLocationMobile()">
    📍 ใช้ตำแหน่ง GPS ปัจจุบัน
  </button>

  <div id="reportPopup" class="report-popup-form" style="display: none;">
    <div class="popup-form-content">
      <span class="close-popup" onclick="hideReportPopup()">×</span>
      <h4>แจ้งปัญหา (หลังจากปักหมุดสำเร็จ)</h4>
      <label for="category">🏷️ หมวดหมู่ปัญหา:</label>
      <select id="category">
        <option value="💡 ไฟฟ้า / หลอดไฟ">💡 ไฟฟ้า / หลอดไฟขาด</option>
        <option value="🏢 อาคาร / แอร์ห้องเรียน">🏢 อาคาร / แอร์ / อุปกรณ์ห้องเรียน</option>
        <option value="💧 ห้องน้ำ / ท่อประปา">💧 ห้องน้ำ / ท่อประปา</option>
        <option value="🛣️ ถนน / ที่จอดรถ">🛣️ ถนน / ทางเดิน / ที่จอดรถ</option>
        <option value="🗑️ ขยะ / ความสะอาด">🗑️ ขยะ / ความสะอาดพื้นที่</option>
        <option value="🌐 อินเทอร์เน็ต / Wi-Fi">🌐 อินเทอร์เน็ต / Wi-Fi</option>
        <option value="🐶 สัตว์จรจัด / สัตว์มีพิษ">🐶 สัตว์จรจัด / สัตว์มีพิษ</option>
        <option value="❓ อื่นๆ">❓ อื่นๆ</option>
      </select>

      <input type="text" id="title" placeholder="ปัญหาอะไร (เช่น แอร์ไม่เย็น)"/>
      <textarea id="detail" placeholder="รายละเอียด (เช่น อ่างแก้วหรือชื่อคณะ)"></textarea>
      
      <input type="file" id="imageInput" accept="image/*"/>
      
      <button type="button" id="gpsBtn" onclick="getUserLocation()">📍 ใช้ตำแหน่งปัจจุบันของฉัน</button>
      <button id="submitBtn">แจ้งปัญหา</button>
    </div>
  </div>



  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Local Storage Mock Firebase -->
  <script src="mock-firebase.js?v=1.6"></script>
  <!--
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  -->
  <script src="script.js?v=1.6"></script>

</body>
</html>
